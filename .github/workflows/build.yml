name: build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: mingw64, arch: x86_64 }
        ]
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        release: false
        update: false
        install: >-
          base-devel
          git
          make
          libtool
          autoconf
          automake-wrapper
          mingw-w64-${{ matrix.arch }}-gcc
          mingw-w64-${{ matrix.arch }}-pkg-config
          mingw-w64-${{ matrix.arch }}-curl
          mingw-w64-${{ matrix.arch }}-openssl
          mingw-w64-${{ matrix.arch }}-libzip
          mingw-w64-${{ matrix.arch }}-libxml2
          mingw-w64-${{ matrix.arch }}-libusb
          mingw-w64-${{ matrix.arch }}-github-cli
          mingw-w64-${{ matrix.arch }}-ntldd-git

    - uses: actions/checkout@main
    - name: prepare environment
      run: |
        echo "target_triplet=`gcc -dumpmachine`" >> $GITHUB_ENV
        echo "PKG_CONFIG=${MINGW_PREFIX}/bin/pkg-config" >> $GITHUB_ENV
        echo "PKG_CONFIG_LIBDIR=${MINGW_PREFIX}/lib/pkgconfig;${MINGW_PREFIX}/share/pkgconfig" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=${MINGW_PREFIX}/lib/pkgconfig;${MINGW_PREFIX}/share/pkgconfig" >> $GITHUB_ENV
        git config --global core.autocrlf false

    # libimobiledevice deps (1-3/8), libimobiledevice (4/8), and then unrelated projects (5-8/8)
    - name: build projects
      run: |
        repos=("libplist" "libimobiledevice-glue" "libusbmuxd" "libtatsu" "libimobiledevice" "libideviceactivation" "ideviceinstaller" "libirecovery")
        for repo in "${repos[@]}"; do
            echo "Building $repo..."
            git clone --depth=1 --recursive "https://github.com/libimobiledevice/$repo"
            pushd "$repo" > /dev/null
            ./autogen.sh CC=gcc CXX=g++ --host="$target_triplet" --prefix="$MINGW_PREFIX" --without-cython
            make -j install
            popd > /dev/null
        done

        echo "Building idevicerestore..."
        git clone -b dev --single-branch --depth=1 --recursive "https://github.com/H-Sofie/idevicerestore"
        pushd "idevicerestore" > /dev/null
        ./autogen.sh CC=gcc CXX=g++ --host="$target_triplet" --prefix="$MINGW_PREFIX" --without-cython
        make -j install
        popd > /dev/null

    - name: prepare release
      run: |
        set -Eeuo pipefail

        REL_DIR="rel"
        BIN_DIR="${MINGW_PREFIX:-/mingw64}/bin"
        mkdir -p "$REL_DIR"

        if ! command -v ntldd >/dev/null 2>&1; then
          pacman -S --noconfirm --needed "${MINGW_PACKAGE_PREFIX:-mingw-w64-x86_64}-ntldd-git"
        fi

        shopt -s nullglob

        declare -a EXE_PATTERNS=("idevice*" "irecovery*" "plistutil.exe" "inetcat.exe" "iproxy.exe")
        declare -a EXES=()

        for pat in "${EXE_PATTERNS[@]}"; do
          while IFS= read -r -d '' f; do EXES+=("$f"); done \
            < <(find "$BIN_DIR" -maxdepth 1 -type f -name "$pat" -print0)
        done

        if [ ${#EXES[@]} -eq 0 ]; then
          echo "No executables found under $BIN_DIR (patterns: ${EXE_PATTERNS[*]})" >&2
          exit 1
        fi

        echo "Copying executables to $REL_DIR:"
        printf '%s\0' "${EXES[@]}" | xargs -0 -I{} cp -vt "$REL_DIR" "{}"

        tmpdeps="$(mktemp)"
        : > "$tmpdeps"

        for exe in "${EXES[@]}"; do
          echo "Resolving deps for $(basename "$exe")"
          ntldd -R "$exe" \
          | sed -n 's/.*=> \(.*\) (.*/\1/p' \
          | while IFS= read -r dep; do
              [ "$dep" = "not found" ] && continue
              if command -v cygpath >/dev/null 2>&1; then
                dep_u="$(cygpath -u "$dep")"
              else
                dep_u="$dep"
              fi
              case "$dep_u" in
                "$MINGW_PREFIX"/*)
                  [ -f "$dep_u" ] && printf '%s\0' "$dep_u" >> "$tmpdeps"
                  ;;
              esac
            done
        done

        if [ -s "$tmpdeps" ]; then
          echo "Copying dependent DLLs to $REL_DIR:"
          sort -z -u "$tmpdeps" | xargs -0 -I{} cp -vt "$REL_DIR" "{}"
        else
          echo "No dependent DLLs discovered under $MINGW_PREFIX."
        fi

        tar -C "$REL_DIR" -cJvf "libimobile-suite-latest_${{ matrix.arch }}-${{ matrix.msystem }}.tar.xz" .

    - name: publish release
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: |
        TAG="${GITHUB_REF##*/}-${GITHUB_SHA:0:7}"
        gh release create "$TAG" --draft --title "Draft Release"
        gh release upload "$TAG" libimobile-suite-latest_${{ matrix.arch }}-${{ matrix.msystem }}.tar.xz
